@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

<script type="text/plain" id="gscode">
/**
 * MÁY CHỦ GOOGLE SHEETS cho app "Chăm Sóc Tại Nhà Tây Ninh"
 * Cách dùng:
 *  1. Tạo 1 Google Sheet mới → Tiện ích mở rộng → Apps Script → xóa hết, dán toàn bộ file này → Lưu.
 *  2. Chọn hàm "setup" → Chạy → cấp quyền. Xem Nhật ký thực thi để lấy ADMIN_KEY.
 *  3. Triển khai → Tùy chọn triển khai mới → Loại: Ứng dụng web
 *     - Thực thi dưới dạng: Tôi
 *     - Người có quyền truy cập: Bất kỳ ai
 *  4. Sao chép URL Ứng dụng web (kết thúc bằng /exec) dán vào app.
 *  Muốn nhận email khi có lịch mới: Cài đặt dự án → Thuộc tính tập lệnh → thêm NOTIFY_EMAIL = email của anh.
 *  Sửa code xong phải: Triển khai → Quản lý bản triển khai → Sửa → Phiên bản mới.
 */
const SHEET_BOOK = 'LichHen';
const SHEET_REC = 'PhieuChamSoc';
const SHEET_CFG = 'CauHinh';
const BK_COLS = ['id','code','created','date','time','name','phone','patient','yob','addr','km','holiday','promo','note','items','total','status','updated','source','zone'];
const REC_COLS = ['id','bookingId','date','time','patient','yob','reason','v','done','assess','plan','staff','sig','updated'];
const JSON_COLS = ['items','v'];
const TZ = 'Asia/Ho_Chi_Minh';

function setup() {
  const ss = SpreadsheetApp.getActive();
  ensureSheet_(ss, SHEET_BOOK, BK_COLS);
  ensureSheet_(ss, SHEET_REC, REC_COLS);
  ensureSheet_(ss, SHEET_CFG, ['key','value']);
  const p = PropertiesService.getScriptProperties();
  if (!p.getProperty('ADMIN_KEY')) {
    p.setProperty('ADMIN_KEY', Utilities.getUuid().replace(/-/g,'').slice(0,12).toUpperCase());
  }
  Logger.log('ADMIN_KEY (nhập vào app, mục Quản lý › Cài đặt): ' + p.getProperty('ADMIN_KEY'));
}

function ensureSheet_(ss, name, cols) {
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  sh.getRange('A:Z').setNumberFormat('@'); // giữ nguyên dạng chữ: số 0 đầu SĐT, ngày, giờ
  if (sh.getLastRow() === 0) {
    sh.appendRow(cols);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, cols.length).setFontWeight('bold');
  }
  return sh;
}

function doGet() {
  return out_({ ok: true, msg: 'Dich vu dang chay' });
}

function doPost(e) {
  let req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, err: 'bad_json' }); }
  const a = req.action;
  try {
    if (a === 'getConfig') return out_({ ok: true, config: getCfg_() });
    if (a === 'createBooking') return out_(createBooking_(req.data, false));
    if (!isAdmin_(req.key)) return out_({ ok: false, err: 'unauthorized' });
    switch (a) {
      case 'ping': return out_({ ok: true, admin: true });
      case 'listAll': return out_({ ok: true, bookings: readAll_(SHEET_BOOK, BK_COLS), records: readAll_(SHEET_REC, REC_COLS) });
      case 'adminCreateBooking': return out_(createBooking_(req.data, true));
      case 'updateBooking': return out_(upsert_(SHEET_BOOK, BK_COLS, req.data));
      case 'deleteBooking': return out_(del_(SHEET_BOOK, req.id));
      case 'saveRecord': return out_(upsert_(SHEET_REC, REC_COLS, req.data));
      case 'deleteRecord': return out_(del_(SHEET_REC, req.id));
      case 'saveConfig': setCfg_(req.data); return out_({ ok: true });
    }
    return out_({ ok: false, err: 'unknown_action' });
  } catch (err) {
    return out_({ ok: false, err: String(err && err.message || err) });
  }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function isAdmin_(k) {
  const real = PropertiesService.getScriptProperties().getProperty('ADMIN_KEY');
  return !!real && typeof k === 'string' && k === real;
}

/* ---------- Cấu hình (bảng giá, gói, khuyến mãi, thông tin cơ sở) ---------- */
function getCfg_() {
  const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_CFG);
  if (!sh || sh.getLastRow() < 2) return null;
  const vals = sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues();
  const row = vals.find(r => r[0] === 'config');
  if (!row) return null;
  try { return JSON.parse(row[1]); } catch (e) { return null; }
}

function setCfg_(cfg) {
  if (!cfg || typeof cfg !== 'object') throw new Error('config_invalid');
  if (cfg.biz) delete cfg.biz.pin;
  const txt = JSON.stringify(cfg);
  if (txt.length > 45000) throw new Error('config_too_large');
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_CFG);
    const last = sh.getLastRow();
    const keys = last >= 2 ? sh.getRange(2, 1, last - 1, 1).getValues().map(r => r[0]) : [];
    const i = keys.indexOf('config');
    if (i >= 0) sh.getRange(i + 2, 2).setValue(txt);
    else sh.appendRow(['config', txt]);
    const j = keys.indexOf('updated');
    const now = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm:ss');
    if (j >= 0) sh.getRange(j + 2, 2).setValue(now); else sh.appendRow(['updated', now]);
  } finally { lock.releaseLock(); }
}

/* ---------- Lịch hẹn ---------- */
function str_(v, max) { return String(v == null ? '' : v).slice(0, max); }

function createBooking_(d, isAdmin) {
  if (!d || typeof d !== 'object') return { ok: false, err: 'no_data' };
  if (d.hp) return { ok: true, booking: { id: 'x', code: 'DL-OK' } }; // bẫy bot: giả vờ thành công
  const phone = str_(d.phone, 15).replace(/[\s.]/g, '');
  if (!/^0\d{9,10}$/.test(phone)) return { ok: false, err: 'phone_invalid' };
  if (!str_(d.name, 80).trim() || !str_(d.addr, 200).trim()) return { ok: false, err: 'missing_fields' };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '') || !/^\d{2}:\d{2}$/.test(d.time || '')) return { ok: false, err: 'datetime_invalid' };
  const items = Array.isArray(d.items) ? d.items.slice(0, 30).map(it => ({
    k: it && it.k === 'p' ? 'p' : 's', id: str_(it && it.id, 24), qty: Math.max(1, Math.min(50, parseInt(it && it.qty, 10) || 1))
  })).filter(it => it.id) : [];
  if (!items.length) return { ok: false, err: 'no_items' };

  if (!isAdmin) { // chống gửi dồn: tối đa 5 lịch / số điện thoại / 10 phút
    const cache = CacheService.getScriptCache();
    const ck = 'rl_' + phone;
    const n = parseInt(cache.get(ck) || '0', 10);
    if (n >= 5) return { ok: false, err: 'too_many' };
    cache.put(ck, String(n + 1), 600);
  }

  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    const now = new Date();
    const b = {
      id: 'b' + now.getTime().toString(36) + Math.floor(Math.random() * 1000),
      code: 'DL' + d.date.slice(2).replace(/-/g, '') + '-' + (100 + Math.floor(Math.random() * 900)),
      created: String(now.getTime()),
      date: d.date, time: d.time,
      name: str_(d.name, 80), phone: phone, patient: str_(d.patient || d.name, 80), yob: str_(d.yob, 4),
      addr: str_(d.addr, 200), km: str_(d.km, 5), holiday: d.holiday ? '1' : '', promo: str_(d.promo, 20).toUpperCase(),
      note: str_(d.note, 1000), items: items, total: String(Math.max(0, Math.round(Number(d.total) || 0))),
      status: 'moi', updated: Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm:ss'), source: isAdmin ? 'admin' : 'web',
      zone: str_(d.zone, 24), zoneName: str_(d.zoneName, 80)
    };
    const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_BOOK);
    sh.appendRow(BK_COLS.map(c => JSON_COLS.indexOf(c) >= 0 ? JSON.stringify(b[c]) : b[c]));
    if (!isAdmin) notify_(b);
    return { ok: true, booking: { id: b.id, code: b.code } };
  } finally { lock.releaseLock(); }
}

function notify_(b) {
  const to = PropertiesService.getScriptProperties().getProperty('NOTIFY_EMAIL');
  if (!to) return;
  try {
    MailApp.sendEmail(to, 'Lịch hẹn mới ' + b.code + ' – ' + b.time + ' ' + b.date,
      'Người liên hệ: ' + b.name + ' – ' + b.phone + '\nNgười bệnh: ' + b.patient + (b.yob ? ' (' + b.yob + ')' : '') +
      '\nĐịa chỉ: ' + b.addr + (b.zoneName ? ', ' + b.zoneName : '') + '\nThời gian: ' + b.time + ' ngày ' + b.date + '\nGhi chú: ' + b.note +
      '\nTạm tính: ' + Number(b.total).toLocaleString('vi-VN') + 'đ\n\nMở app › Quản lý để xác nhận.');
  } catch (e) { /* hết hạn mức email thì bỏ qua */ }
}

/* ---------- Đọc / ghi chung ---------- */
function readAll_(name, cols) {
  const sh = SpreadsheetApp.getActive().getSheetByName(name);
  const last = sh.getLastRow();
  if (last < 2) return [];
  const vals = sh.getRange(2, 1, last - 1, cols.length).getValues();
  return vals.filter(r => r[0]).map(r => {
    const o = {};
    cols.forEach((c, i) => {
      let v = r[i];
      if (v instanceof Date) v = Utilities.formatDate(v, TZ, c === 'time' ? 'HH:mm' : 'yyyy-MM-dd');
      if (JSON_COLS.indexOf(c) >= 0) { try { v = JSON.parse(v || (c === 'items' ? '[]' : '{}')); } catch (e) { v = c === 'items' ? [] : {}; } }
      o[c] = v;
    });
    if (o.phone !== undefined && /^\d{9}$/.test(String(o.phone))) o.phone = '0' + o.phone;
    if (o.holiday !== undefined) o.holiday = o.holiday === '1' || o.holiday === true || o.holiday === 'TRUE';
    if (o.total !== undefined) o.total = Number(o.total) || 0;
    return o;
  });
}

function upsert_(name, cols, d) {
  if (!d || !d.id) return { ok: false, err: 'no_id' };
  d.updated = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm:ss');
  if (d.holiday !== undefined) d.holiday = d.holiday ? '1' : '';
  if (typeof d.sig === 'string' && d.sig.length > 45000) d.sig = ''; // ô Sheets tối đa 50.000 ký tự
  const row = cols.map(c => {
    const v = d[c];
    if (JSON_COLS.indexOf(c) >= 0) return JSON.stringify(v || (c === 'items' ? [] : {}));
    return v == null ? '' : String(v);
  });
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    const sh = SpreadsheetApp.getActive().getSheetByName(name);
    const last = sh.getLastRow();
    const ids = last >= 2 ? sh.getRange(2, 1, last - 1, 1).getValues().map(r => r[0]) : [];
    const i = ids.indexOf(d.id);
    if (i >= 0) sh.getRange(i + 2, 1, 1, cols.length).setValues([row]);
    else sh.appendRow(row);
    return { ok: true };
  } finally { lock.releaseLock(); }
}

function del_(name, id) {
  if (!id) return { ok: false, err: 'no_id' };
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    const sh = SpreadsheetApp.getActive().getSheetByName(name);
    const last = sh.getLastRow();
    if (last < 2) return { ok: true };
    const ids = sh.getRange(2, 1, last - 1, 1).getValues().map(r => r[0]);
    const i = ids.indexOf(id);
    if (i >= 0) sh.deleteRow(i + 2);
    return { ok: true };
  } finally { lock.releaseLock(); }
}

</script>

  else{const s=svc(it.id);if(!s)return;const pr=ov===null?s.price:ov;lines.push({k:'s',id:s.id,g:s.g,name:s.name,unit:s.unit,price:pr,list:s.price,ov:ov!==null&&ov!==s.price,qty,amount:pr*qty,order:s.order});}
 });
 const extrasTotal=extras.reduce((a,x)=>a+x.amount,0);
 const subtotal=lines.reduce((a,l)=>a+l.amount,0);
 const f=st.fees;const zz=b.zone&&b.zone!=='other'?zone(b.zone):null;const km=zz?0:Math.max(0,Number(b.km)||0);
 const travel=zz?(Number(zz.fee)||0):Math.max(0,Math.ceil(km-f.freeKm))*f.perKm;
 let timeFee=0,timeLbl='';
 if(b.time){const h=parseInt(b.time.split(':')[0],10);if(h>=21||h<6){timeFee=f.night;timeLbl='Phụ thu đêm (21:00–6:00)';}else if(h>=17){timeFee=f.evening;timeLbl='Phụ thu ngoài giờ (17:00–21:00)';}}
 const holidayFee=b.holiday?Math.round(subtotal*f.holidayPct/100/1000)*1000:0;
 let discount=0,promoMsg='',promoOk=false;
 const p=findPromo(b.promo);
 if(b.promo&&b.promo.trim()){
  if(!p)promoMsg='Không tìm thấy mã này';
  else if(!p.on)promoMsg='Mã đã ngừng áp dụng';
  else if(p.end&&p.end<todayISO())promoMsg='Mã đã hết hạn ('+viDate(p.end)+')';
  else if(p.min&&subtotal<p.min)promoMsg='Đơn từ '+fmt(p.min)+' mới dùng được mã này';
  else{
   const scope=p.scope==='all'?null:p.scope.split(',').map(x=>x.trim());
   const base=lines.filter(l=>l.k==='s'&&(!scope||scope.includes(l.g))).reduce((a,l)=>a+l.amount,0);
   if(base<=0)promoMsg='Mã không áp dụng cho dịch vụ đã chọn (không áp dụng cho gói)';
   else{discount=p.type==='pct'?base*p.value/100:Math.min(p.value,base);if(p.max&&discount>p.max)discount=p.max;discount=Math.round(discount/1000)*1000;promoOk=true;promoMsg='Áp dụng: '+p.name;}
  }
 }
 const total=Math.max(0,subtotal+travel+timeFee+holidayFee-discount+extrasTotal);
return {lines,extras,extrasTotal,subtotal,travel,km,zoneObj:zz,timeFee,timeLbl,holidayFee,discount,promoMsg,promoOk,total,needsOrder:lines.some(l=>l.order)};
}

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function vietqr(bin,acc,amount,info){
 const mai=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
 let p=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('38',mai)+tlv('53','704')+(amount?tlv('54',String(Math.round(amount))):'')+tlv('58','VN');
 const inf=stripVN(info).slice(0,25);if(inf)p+=tlv('62',tlv('08',inf));
 p+='6304';return p+crc16(p);
}

function drawQR(el,text,size){el.innerHTML='';if(typeof QRCode==='undefined'){el.innerHTML='<div class="small muted">Không tải được thư viện QR</div>';return;}try{new QRCode(el,{text,width:size||180,height:size||180,correctLevel:QRCode.CorrectLevel.M});}catch(e){el.innerHTML='<div class="small muted">Không tạo được mã QR</div>';}}

const ERRMSG={no_url:'Chưa nhập URL Apps Script',unauthorized:'Sai mã quản trị (ADMIN_KEY)',phone_invalid:'Số điện thoại không hợp lệ',too_many:'Gửi quá nhiều lịch trong 10 phút, thử lại sau',config_too_large:'Bảng giá quá lớn để lưu',missing_fields:'Thiếu họ tên hoặc địa chỉ',no_items:'Chưa chọn dịch vụ',datetime_invalid:'Ngày giờ không hợp lệ',bad_response:'URL không phải Ứng dụng web Apps Script (kiểm tra quyền "Bất kỳ ai")',no_id:'Thiếu mã bản ghi',unknown_action:'Apps Script cũ, hãy dán lại mã mới và triển khai phiên bản mới'};

function push(op){st.queue.push(op);save();updateSyncChip();flush();}
async function flush(){
 if(syncBusy||!isAdminSync())return;syncBusy=true;let remapped=false;
 try{
  while(st.queue.length){
   const op=st.queue[0];
   try{
    const j=await api(op.a,Object.assign({key:st.sync.key},op.p));
    if(op.a==='adminCreateBooking'&&j.booking){
     const nid=j.booking.id,oid=op.localId;const b=st.bookings.find(x=>x.id===oid);
     if(b){b.id=nid;b.code=j.booking.code;b.srv=true;delete b.queued;remapped=true;}
     if(edB&&edB.id===oid)edB.id=nid;
     st.queue.slice(1).forEach(q=>{const d=q.p&&q.p.data;if(d&&d.id===oid)d.id=nid;if(d&&d.bookingId===oid)d.bookingId=nid;if(q.p&&q.p.id===oid)q.p.id=nid;});
     st.records.forEach(r=>{if(r.bookingId===oid)r.bookingId=nid;});
    }
    st.queue.shift();save();
   }catch(e){
    if(FATAL.includes(e.message)){st.queue.shift();save();toast('Bỏ qua 1 thao tác lỗi: '+errText(e));continue;}
    throw e;
   }
  }
  st.sync.err='';
 }catch(e){st.sync.err=errText(e);}
 finally{syncBusy=false;save();updateSyncChip();
  if(remapped&&curRoute()==='admin'&&unlocked&&!editRec&&!$('#modalRoot').innerHTML){const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae)))render();}}
}
async function pullAll(silent){

 st.records.filter(r=>!r.srv&&!r.sample&&!st.queue.some(q=>q.a==='saveRecord'&&q.p.data.id===r.id)).forEach(r=>st.queue.push({a:'saveRecord',p:{data:pick(r,REC_FIELDS)}}));
 save();

 try{

  const had=st.sync.last>0;const prev=new Set(st.bookings.map(b=>b.id));
  const fresh=j.bookings.filter(b=>b.status==='moi'&&!prev.has(b.id)).length;

  st.sync.last=Date.now();st.sync.err='';save();
  if(had&&fresh)toast('Có '+fresh+' lịch hẹn mới');else if(!silent)toast('Đã tải dữ liệu từ Google Sheets');
  const ae=document.activeElement;const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae);
  if(curRoute()==='admin'&&unlocked&&!editRec&&!typing&&!$('#modalRoot').innerHTML)render();else updateSyncChip();
  return true;
 }catch(e){st.sync.err=errText(e);save();updateSyncChip();if(!silent)toast(st.sync.err);return false;}

 h+='<input id="priceSearch" type="search" placeholder="Tìm dịch vụ, ví dụ: sonde, HbA1c" value="'+esc(priceQ)+'" aria-label="Tìm dịch vụ">';
 const q=priceQ.trim().toLowerCase();
 h+='<div id="priceList" class="stack">'+priceListHTML(q)+'</div>';
 const f=st.fees;
 h+='<section class="card"><h3>Phụ phí</h3><table><tbody><tr><td>Đi lại trong khu vực ưu tiên</td><td class="r num">'+priZoneFeeText()+'</td></tr><tr><td>Khu vực khác</td><td class="r num">Miễn phí '+f.freeKm+' km đầu, sau đó '+fmt(f.perKm)+'/km</td></tr><tr><td>Ngoài giờ 17:00–21:00</td><td class="r num">+'+fmt(f.evening)+'/lượt</td></tr><tr><td>Ban đêm 21:00–6:00</td><td class="r num">+'+fmt(f.night)+'/lượt</td></tr><tr><td>Lễ, Tết</td><td class="r num">+'+f.holidayPct+'% giá dịch vụ</td></tr></tbody></table></section>';
 h+=footer();return h;
}
function priZoneFeeText(){const fs=(st.zones||[]).filter(z=>z.on&&z.pri).map(z=>Number(z.fee)||0);if(!fs.length)return '–';const mx=Math.max(...fs),mn=Math.min(...fs);return mx===0?'Miễn phí':mn===mx?fmt(mn):'Từ '+(mn?fmt(mn):'miễn phí')+' đến '+fmt(mx);}
function priceListHTML(q){
 let h='';
 GROUPS.filter(g=>priceGroup==='all'||priceGroup===g.id).forEach(g=>{
  const list=st.services.filter(s=>s.g===g.id&&s.on&&(!q||s.name.toLowerCase().includes(q)));
  if(!list.length)return;
  h+='<section class="card" id="g-'+g.id+'"><div class="row" style="margin-bottom:6px"><span class="gicon">'+icon(g.id)+'</span><h2>'+esc(g.name)+'</h2></div>';
  if(g.id==='xn')h+='<div class="small muted" style="margin-bottom:6px">Mẫu được gửi phòng xét nghiệm liên kết; kết quả trả qua Zalo trong ngày.</div>';
  if(g.id==='bs')h+='<div class="small muted" style="margin-bottom:6px">Bác sĩ liên kết có chứng chỉ hành nghề; tiền thuốc tính riêng theo đơn.</div>';
  list.forEach(s=>{h+='<div class="svc"><div><div class="nm">'+esc(s.name)+'</div><div class="small muted">/'+esc(s.unit)+(s.note?' · '+esc(s.note):'')+'</div>'+(s.order?'<div class="flag">Cần đơn hoặc y lệnh bác sĩ</div>':'')+'</div><div class="pr num">'+fmt(s.price)+'</div><div></div><div class="act">'+qtyCtl('s',s.id)+'</div></div>';});
  h+='</section>';
 });
 return h||'<div class="card muted">Không có dịch vụ phù hợp.</div>';
}

/* ====================== VIEW: ƯU ĐÃI ====================== */
function vOffers(){
 let h='<h1>Gói dịch vụ & ưu đãi</h1><section class="stack"><h2>Gói tiết kiệm</h2>';
 st.packages.filter(p=>p.on).forEach(p=>{const o=pkgOriginal(p);
  h+='<div class="card stack" style="gap:8px"><div class="row" style="justify-content:space-between"><div class="row"><span class="gicon">'+icon(p.g)+'</span><h3>'+esc(p.name)+'</h3></div>'+(o>p.price?'<span class="save">Tiết kiệm '+fmt(o-p.price)+'</span>':'')+'</div>';
  h+='<div class="small muted">'+p.items.map(([sid,q])=>{const s=svc(sid);return s?esc(s.name)+(q>1?' × '+q:''):'';}).filter(Boolean).join(' · ')+'</div>';
  if(p.note)h+='<div class="small">'+esc(p.note)+'</div>';
  h+='<div class="row" style="justify-content:space-between"><div class="row"><b class="num" style="font-size:1.1rem">'+fmt(p.price)+'</b>'+(o>p.price?'<span class="strike num small">'+fmt(o)+'</span>':'')+'</div>'+qtyCtl('p',p.id)+'</div></div>';});
 h+='</section><section class="stack"><h2>Mã ưu đãi</h2>';
 const act=st.promos.filter(p=>p.on&&(!p.end||p.end>=todayISO()));
 if(!act.length)h+='<div class="card muted">Hiện chưa có mã ưu đãi.</div>';
 act.forEach(p=>{h+='<div class="card row" style="justify-content:space-between"><div><span class="code">'+esc(p.code)+'</span><div style="margin-top:8px">'+esc(p.name)+'</div><div class="small muted">'+promoCond(p)+'</div></div><button class="btn sm" data-act="copycode" data-code="'+esc(p.code)+'">Sao chép mã</button></div>';});
 h+='<div class="small muted">Mỗi đơn dùng 1 mã. Mã không áp dụng cho giá gói. Ưu đãi do cơ sở ngoài công lập cung cấp.</div></section>'+footer();
 return h;
}
function promoCond(p){const parts=[];parts.push(p.type==='pct'?'Giảm '+p.value+'%'+(p.max?', tối đa '+fmt(p.max):''):'Giảm '+fmt(p.value));if(p.min)parts.push('đơn từ '+fmt(p.min));parts.push(p.scope==='all'?'mọi dịch vụ lẻ':'nhóm '+p.scope.split(',').map(x=>GMAP[x.trim()]?GMAP[x.trim()].short:x).join(', '));if(p.end)parts.push('đến '+viDate(p.end));return parts.join(' · ');}

let draft={name:'',phone:'',patient:'',yob:'',addr:'',zone:'',km:'',date:todayISO(1),time:'08:00',holiday:false,promo:'',note:'',consent:false};
let draftFromAdmin=false;
function vBooking(){
 let h='<h1>'+(draftFromAdmin?'Thêm lịch hẹn':'Đặt lịch chăm sóc tại nhà')+'</h1>';
 h+='<form id="bkForm" class="stack" novalidate>';
 h+='<section class="card stack"><h2>Dịch vụ đã chọn</h2><div id="bkItems">'+bkItemsHTML()+'</div><div class="row"><a class="btn sm" href="#prices">+ Dịch vụ lẻ</a><a class="btn sm" href="#offers">+ Gói ưu đãi</a></div></section>';

 h+='<section class="card stack"><h2>Thông tin liên hệ</h2><div class="grid2">'+
  fld('name','Họ tên người liên hệ','text','Nguyễn Văn A')+fld('phone','Số điện thoại (Zalo)','tel','09xx xxx xxx')+
  fld('patient','Họ tên người bệnh','text','Để trống nếu là người liên hệ')+fld('yob','Năm sinh người bệnh','number','1950')+'</div>'+
  zoneSelect()+'<div id="kmWrap"'+(draft.zone==='other'?'':' hidden')+'>'+fld('km','Khoảng cách ước tính từ trung tâm Tân An (km)','number','Ví dụ: 15')+'</div>'+
  fld('addr','Địa chỉ cụ thể','text','Số nhà, đường, khu phố/ấp')+
  '<div class="grid2">'+fld('date','Ngày','date','')+fld('time','Giờ','time','')+'</div>'+
  '<label class="check"><input type="checkbox" id="f-holiday"'+(draft.holiday?' checked':'')+'> Ngày lễ, Tết</label>'+
  '<div><label for="f-note">Tình trạng người bệnh, y lệnh (nếu có)</label><textarea id="f-note" placeholder="Ví dụ: sau mổ 5 ngày, vết mổ bụng 8 cm; có đơn truyền của bác sĩ BV...">'+esc(draft.note)+'</textarea></div>'+
 '</section>';
 h+='<section class="card stack"><h2>Mã ưu đãi & chi phí</h2>'+fld('promo','Mã ưu đãi','text','Ví dụ: KHAITRUONG')+'<div id="bkSum">'+bkSumHTML()+'</div></section>';
 h+='<label class="check"><input type="checkbox" id="f-consent"'+(draft.consent?' checked':'')+'> Tôi đồng ý cho cơ sở lưu thông tin trên để liên hệ, chăm sóc và lập phiếu chăm sóc.</label>';
 h+='<div style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true"><label for="f-hp">Để trống ô này</label><input id="f-hp" type="text" tabindex="-1" autocomplete="off"></div>';
 h+='<div id="bkErr" class="note" hidden></div><button type="submit" class="btn pri" style="justify-content:center;padding:12px">Gửi đặt lịch</button>';
 if(draftFromAdmin)h+='<button type="button" class="btn ghost" data-act="cancelAdminDraft">Quay lại Quản lý</button>';
 h+='</form><div class="small muted">Giá trên là tạm tính. Điều dưỡng sẽ xác nhận lại trước khi đến.</div>';

}
function zoneSelect(){
 const gs=zoneGroups();
 let o='<option value="">— Chọn phường/xã —</option>'+gs.map(g=>'<optgroup label="'+esc(g.grp)+'">'+g.list.map(z=>'<option value="'+z.id+'"'+(draft.zone===z.id?' selected':'')+'>'+esc(z.name)+(z.hint?' ('+esc(z.hint)+')':'')+'</option>').join('')+'</optgroup>').join('')+'<option value="other"'+(draft.zone==='other'?' selected':'')+'>Khu vực khác</option>';
 return '<div><label for="f-zone">Phường/xã (tên mới sau sáp nhập)</label><select id="f-zone">'+o+'</select><div class="small muted" style="margin-top:4px">Trong ngoặc là tên phường/xã cũ để dễ tìm.</div></div>';
}
function zoneFeeText(z){return z.fee?'Phí đi lại '+fmt(z.fee):'Miễn phí đi lại';}
function groupSelect(id,val){return '<select id="'+id+'">'+GROUPS.map(g=>'<option value="'+g.id+'"'+(g.id===val?' selected':'')+'>'+esc(g.short)+'</option>').join('')+'</select>';}
function catOptions(withPkg,byName){return GROUPS.map(g=>'<optgroup label="'+esc(g.short)+'">'+st.services.filter(x=>x.g===g.id&&x.on).map(x=>'<option value="'+(byName?esc(x.name):'s:'+x.id)+'">'+esc(x.name)+(byName?'':' – '+fmt(x.price))+'</option>').join('')+'</optgroup>').join('')+(withPkg?'<optgroup label="Gói">'+st.packages.filter(x=>x.on).map(x=>'<option value="p:'+x.id+'">'+esc(x.name)+' – '+fmt(x.price)+'</option>').join('')+'</optgroup>':'');}
function fld(k,lab,type,ph){return '<div><label for="f-'+k+'">'+lab+'</label><input id="f-'+k+'" type="'+type+'" value="'+esc(draft[k])+'" placeholder="'+esc(ph)+'"'+(type==='number'?' inputmode="numeric" min="0"':'')+'></div>';}
function bkItemsHTML(){
 if(!st.cart.length)return '<div class="muted">Chưa chọn dịch vụ nào.</div>';
 const q=quote({items:st.cart});
 return q.lines.map(l=>'<div class="svc"><div><div class="nm">'+esc(l.name)+(l.k==='c'?' <span class="pill p-acc">nhập tay</span>':'')+'</div><div class="small muted num">'+fmt(l.price)+'/'+esc(l.unit)+'</div>'+(l.order?'<div class="flag">Cần đơn hoặc y lệnh bác sĩ</div>':'')+'</div><div class="pr num">'+fmt(l.amount)+'</div><div></div><div class="act">'+qtyCtl(l.k,l.id)+'</div></div>').join('')+q.extras.map(x=>'<div class="svc"><div><div class="nm">'+esc(x.name)+' <span class="pill p-moi">'+(x.amount<0?'giảm thêm':'phụ thu')+'</span></div></div><div class="pr num">'+(x.amount<0?'−'+fmt(-x.amount):fmt(x.amount))+'</div><div></div><div class="act"><button type="button" class="btn sm danger" data-act="bk-delx" data-id="'+esc(x.id)+'">Bỏ</button></div></div>').join('');
}
function bkSumHTML(){
 const q=quote(Object.assign({},draft,{items:st.cart}));
 let h='<div class="sum"><span>Tiền dịch vụ</span><span class="num">'+fmt(q.subtotal)+'</span></div>';
 h+='<div class="sum"><span>Đi lại'+(q.zoneObj?' ('+esc(q.zoneObj.name)+(q.zoneObj.pri?', khu vực ưu tiên':'')+')':q.km?' ('+q.km+' km)':'')+'</span><span class="num">'+(q.travel?fmt(q.travel):'Miễn phí')+'</span></div>';
 if(draft.zone==='other')h+='<div class="small flag">Ngoài khu vực ưu tiên: điều dưỡng sẽ báo lại lịch trống và phí đi lại.</div>';
 if(q.timeFee)h+='<div class="sum"><span>'+q.timeLbl+'</span><span class="num">'+fmt(q.timeFee)+'</span></div>';
 if(q.holidayFee)h+='<div class="sum"><span>Phụ thu lễ, Tết ('+st.fees.holidayPct+'%)</span><span class="num">'+fmt(q.holidayFee)+'</span></div>';
 if(q.discount)h+='<div class="sum disc"><span>Giảm giá ('+esc(draft.promo.toUpperCase())+')</span><span class="num">−'+fmt(q.discount)+'</span></div>';
 q.extras.forEach(x=>{h+='<div class="sum'+(x.amount<0?' disc':'')+'"><span>'+esc(x.name)+'</span><span class="num">'+(x.amount<0?'−'+fmt(-x.amount):fmt(x.amount))+'</span></div>';});
 if(q.promoMsg)h+='<div class="small '+(q.promoOk?'disc':'flag')+'">'+esc(q.promoMsg)+'</div>';
 h+='<div class="sum tot"><span>Tạm tính</span><span class="num">'+fmt(q.total)+'</span></div>';
 if(q.needsOrder)h+='<div class="note">Đơn có tiêm hoặc truyền: vui lòng chuẩn bị đơn thuốc hoặc y lệnh của bác sĩ.</div>';
 return h;
}
function readDraft(){['name','phone','patient','yob','addr','zone','km','date','time','promo'].forEach(k=>{const el=$('#f-'+k);if(el)draft[k]=el.value;});const n=$('#f-note');if(n)draft.note=n.value;const ho=$('#f-holiday');if(ho)draft.holiday=ho.checked;const c=$('#f-consent');if(c)draft.consent=c.checked;}
function submitBooking(){
 readDraft();const err=[];
 if(!st.cart.length)err.push('Chọn ít nhất 1 dịch vụ.');
 if(!draft.name.trim())err.push('Nhập họ tên người liên hệ.');
 if(!/^0\d{9,10}$/.test(draft.phone.replace(/[\s.]/g,'')))err.push('Số điện thoại cần 10–11 chữ số, bắt đầu bằng 0.');
 if(!draft.zone)err.push('Chọn phường/xã.');
 if(!draft.addr.trim())err.push('Nhập địa chỉ.');
 if(!draft.date)err.push('Chọn ngày.');else if(draft.date<todayISO()&&!draftFromAdmin)err.push('Ngày hẹn đã qua.');
 if(!draft.time)err.push('Chọn giờ.');
 if(!draft.consent)err.push('Cần đồng ý cho cơ sở lưu thông tin.');
 const box=$('#bkErr');
 if(err.length){box.hidden=false;box.innerHTML=err.map(esc).join('<br>');box.scrollIntoView({block:'center'});return;}
 const q=quote(Object.assign({},draft,{items:st.cart}));
 const b=Object.assign({},draft,{id:'b'+Date.now().toString(36),code:'DL'+draft.date.slice(2).replace(/-/g,'')+'-'+(100+Math.floor(Math.random()*900)),created:Date.now(),items:st.cart.map(x=>Object.assign({},x)),promo:q.promoOk?draft.promo.trim().toUpperCase():'',status:'moi',total:q.total,patient:draft.patient||draft.name});
 delete b.consent;
 const hp=($('#f-hp')||{}).value||'';
 st.bookings.unshift(b);st.cart=[];
 draft={name:'',phone:'',patient:'',yob:'',addr:'',zone:'',km:'',date:todayISO(1),time:'08:00',holiday:false,promo:'',note:'',consent:false};
 save();
 const fromAdmin=draftFromAdmin;draftFromAdmin=false;
 if(fromAdmin){
  if(isAdminSync()){b.queued=true;st.queue.push({a:'adminCreateBooking',p:{data:pick(b,BK_FIELDS)},localId:b.id});push({a:'updateBooking',p:{data:pick(b,BK_FIELDS)}});}
  adminTab='appts';location.hash='#admin';toast('Đã thêm lịch '+b.code);return;
 }
 render();
 if(!syncUrl()){showBookingDone(b,null);return;}
 openModal('<div class="stack" style="align-items:center;padding:20px 0"><h2>Đang gửi lịch hẹn…</h2><div class="small muted">Vui lòng chờ vài giây</div></div>');
 api('createBooking',{data:Object.assign(pick(b,BK_FIELDS),{hp,zoneName:zone(b.zone)?zone(b.zone).name+' ('+zone(b.zone).grp+')':(b.zone==='other'?'Khu vực khác':'')})})
  .then(j=>{if(j.booking){b.id=j.booking.id;b.code=j.booking.code;}b.srv=true;save();showBookingDone(b,true);})
  .catch(e=>showBookingDone(b,false,errText(e)));
}
function bookingText(b){
 const q=quote(b);const B=st.biz;
 let t='ĐẶT LỊCH – '+B.name+'\nMã: '+b.code+'\nNgười liên hệ: '+b.name+' – '+b.phone+'\nNgười bệnh: '+(b.patient||b.name)+(b.yob?' ('+b.yob+')':'')+'\nĐịa chỉ: '+b.addr+(zone(b.zone)?', '+zone(b.zone).name+' ('+zone(b.zone).grp+')':b.zone==='other'?' (ngoài khu vực ưu tiên)':'')+(b.km?' (~'+b.km+' km)':'')+'\nThời gian: '+b.time+' ngày '+viDate(b.date)+(b.holiday?' (lễ/Tết)':'')+'\nDịch vụ:\n';
 q.lines.forEach(l=>{t+='- '+l.name+(l.qty>1?' × '+l.qty:'')+': '+fmt(l.amount)+'\n';});
 q.extras.forEach(x=>{t+='- '+x.name+': '+(x.amount<0?'-'+fmt(-x.amount):fmt(x.amount))+'\n';});
 if(q.travel)t+='Di chuyển: '+fmt(q.travel)+'\n';
 if(q.timeFee)t+=q.timeLbl+': '+fmt(q.timeFee)+'\n';
 if(q.holidayFee)t+='Phụ thu lễ/Tết: '+fmt(q.holidayFee)+'\n';
 if(q.discount)t+='Giảm giá ('+b.promo+'): -'+fmt(q.discount)+'\n';
 t+='TẠM TÍNH: '+fmt(q.total)+'\n';
 if(b.note)t+='Ghi chú: '+b.note+'\n';
 return t;
}
function payQRBlock(b,id){const B=st.biz;if(!B.bankBin||!B.bankAcc)return '';return '<div class="stack" style="align-items:center;gap:6px"><div class="qrbox" id="'+id+'"></div><div class="small muted" style="text-align:center">'+esc((BANKS.find(x=>x[0]===B.bankBin)||['',''])[1])+' · '+esc(B.bankAcc)+(B.bankOwner?' · '+esc(B.bankOwner):'')+'<br>Nội dung: '+esc(b.code)+' · '+fmt(b.total)+'</div></div>';}
function showBookingDone(b,sent,err){
 const B=st.biz;const txt=bookingText(b);
 const head=sent===true?'<h2>Đã gửi lịch hẹn '+esc(b.code)+'</h2><div class="info">Điều dưỡng đã nhận được lịch và sẽ gọi hoặc nhắn Zalo để xác nhận. Cần gấp, anh/chị có thể nhắn thêm qua Zalo.</div>'
  :sent===false?'<h2>Chưa gửi được lịch hẹn</h2><div class="note">'+esc(err||'Lỗi kết nối')+'. Vui lòng sao chép tin nhắn dưới đây và gửi qua Zalo.</div>'
  :'<h2>Đã ghi nhận lịch hẹn '+esc(b.code)+'</h2><p class="muted" style="margin:0">Bước cuối: gửi thông tin này cho điều dưỡng qua Zalo để được xác nhận.</p>';
 let h='<div class="stack">'+head+'<pre class="msg">'+esc(txt)+'</pre><div class="row"><button class="btn pri" data-act="copytxt">Sao chép tin nhắn</button>'+(B.zalo?'<a class="btn" href="https://zalo.me/'+esc(B.zalo.replace(/\s/g,''))+'" target="_blank" rel="noopener">Mở Zalo '+esc(B.zalo)+'</a>':'')+'</div>'+(B.hotline?'<div class="small">Hoặc gọi: <b>'+esc(B.hotline)+'</b></div>':'')+(B.bankBin&&B.bankAcc?'<div class="small muted">Thanh toán sau khi thực hiện dịch vụ. Mã QR chuyển khoản:</div>'+payQRBlock(b,'qrDone'):'')+'<button class="btn ghost" data-act="close">Đóng</button></div>';
 openModal(h);mem=txt;
 if(B.bankBin&&B.bankAcc)drawQR($('#qrDone'),vietqr(B.bankBin,B.bankAcc,b.total,b.code),170);
}

function vflag(k,v,v2){
 const n=parseFloat(v);if(v===''||v==null||isNaN(n))return '';
 const bad=m=>'<div class="vflag bad">'+m+'</div>',ok='<div class="vflag ok">Trong giới hạn</div>';
 switch(k){
  case 'p':return n>100?bad('Nhịp nhanh'):n<60?bad('Nhịp chậm'):ok;
  case 'bp':{const d=parseFloat(v2);if(n>=180||d>=110)return bad('Rất cao – báo bác sĩ');if(n>=140||d>=90)return bad('Cao');if(n<90||d<60)return bad('Thấp');return ok;}
  case 't':return n>=38.5?bad('Sốt cao'):n>=37.5?bad('Sốt'):n<36?bad('Hạ thân nhiệt'):ok;
  case 'spo2':return n<90?bad('Rất thấp – xử trí ngay'):n<94?bad('Thấp'):ok;
  case 'rr':return n>24?bad('Thở nhanh'):n<12?bad('Thở chậm'):ok;
  case 'glu':return n<3.9?bad('Hạ đường huyết'):n>11.1?bad('Tăng cao'):ok;
 }return '';
}

function sigData(c){const o=document.createElement('canvas');o.width=360;o.height=120;const x=o.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,360,120);x.drawImage(c,0,0,360,120);return o.toDataURL('image/jpeg',0.7);}
function initSig(){
 const c=$('#sig');if(!c)return;const dpr=window.devicePixelRatio||1;const rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;
 const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#14302f';sigCtx=ctx;sigDirty=false;
 if(editRec.sig){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=editRec.sig;}
 let drawing=false;
 const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
 c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);});
 c.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();sigDirty=true;});
 const end=()=>{drawing=false;};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

document.addEventListener('change',e=>{

 let val=t.type==='checkbox'?t.checked:t.value;
 const numF=['price','value','max','min','freeKm','perKm','evening','night','holidayPct'];
 if(numF.includes(field||id))val=Math.max(0,Number(val)||0);
 if(kind!=='biz')st.cfgDirty=true;
 if(kind==='svc'){const s=svc(id);if(s)s[field]=val;}
 else if(kind==='pkg'){const p=pkg(id);if(p)p[field]=val;}
 else if(kind==='promo'){const p=st.promos[+id];if(p){if(field==='code')val=String(val).toUpperCase().replace(/\s/g,'');p[field]=val;}}
 else if(kind==='fee'){st.fees[field]=val;}
 else if(kind==='zone'){const z=zone(id);if(z){if(field==='fee')val=Math.max(0,Number(val)||0);z[field]=val;}}
 else if(kind==='biz'){st.biz[field]=val;if(field!=='pin')st.cfgDirty=true;if(field==='name'||field==='tag'){$('#bizName').textContent=st.biz.name;$('#bizTag').textContent=st.biz.tag;}}
 save();
}
function doRestore(txt){try{const o=JSON.parse(txt);if(!o||!o.services||!o.biz)throw 0;const sy=st.sync;st=o;st.sync=Object.assign({url:'',key:'',last:0,err:'',cfgAt:''},o.sync||{},{url:sy.url,key:sy.key});if(!Array.isArray(st.queue))st.queue=[];save();render();toast('Đã khôi phục dữ liệu');}catch(err){toast('Nội dung sao lưu không hợp lệ');}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='pinIn'){e.preventDefault();const b=document.querySelector('[data-act="unlock"]');if(b)b.click();}});

window.__test={quote,vietqr,crc16,st:()=>st,pullAll,flush};
render();
pullConfig();
})();
